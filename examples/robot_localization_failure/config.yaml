    - ros_msgs/sensor_msgs/msg/LaserScan.msg
    - ros_msgs/nav2_msgs/msg/Particle.msg
    - ros_msgs/nav2_msgs/msg/ParticleCloud.msg

features:
  use_temporal: true
  use_scanmap: true
  use_particle: true
  use_amcl_pose: false
  label_col: lbl_win_02s   # Best labeling strategy (MCC=0.877). Use "is_delocalized" for original.

experiment:
  train_maps: ["unsym map 1"]
  eval_maps:  ["unsym map 1"]
  odometry: "[0.25, 0.25, 0.1, 0.25, 0.25, 0.1]" 
  notes:  "Small odom drift in theta" 
  tags: ["markus"] 
report:
  generate_pdf: true

localization:
  position_threshold: 0.2
  heading_threshold: 0.2

resampling:
  target_ratio: 3  # negatives per positive (e.g. 3 = 3:1)

optuna:
  n_trials: 50
  model_name: "small_odometry_drift"
  early_stop_f1: 1.1  # disabled — set above 1.0 so all N trials always run